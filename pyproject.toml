[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "policylens"
version = "0.1.0"
description = "An evaluated RAG system for company-policy documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "plotly>=5.24",
  "streamlit>=1.40",
  "PyMuPDF>=1.24",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.3"]
dev = ["pytest>=8.3"]

[project.scripts]
policylens-evaluate = "policylens.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
